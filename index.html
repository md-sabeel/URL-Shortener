<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Shortify | URL Shortener</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    🔗 Shortify
</nav>

<!-- Main -->
<main class="container">
    <div class="glass">

        <h1 class="title">Shorten Your URL</h1>

        <input
                type="url"
                id="longUrl"
                placeholder="Enter a valid URL (https://...)"
        />

        <button onclick="shortenUrl()">Shorten URL 🚀</button>

        <div class="result hidden" id="result">
            <input type="text" id="shortUrl" readonly />
            <button class="copy-btn" onclick="copyUrl()">📋</button>
        </div>

    </div>
</main>

<!-- Toast -->
<div id="toast"></div>

<!-- Footer -->
<footer>
    © 2026 Shortify | Built with ❤️ using JavaScript
</footer>

<script src="script.js"></script>
</body>
</html>
